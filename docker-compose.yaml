services:
  app:
    build: .
    container_name: bootcamp_app
    ports:
      - "80:8000"
    restart: always
    environment:
      POSTGRES_USER: bootcamp
      POSTGRES_PASSWORD: bootcamp123
      POSTGRES_DB: bootcamp_db
      POSTGRES_HOST: db
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: bootcamp_db
    restart: always
    environment:
      POSTGRES_USER: bootcamp
      POSTGRES_PASSWORD: bootcamp123
      POSTGRES_DB: bootcamp_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
