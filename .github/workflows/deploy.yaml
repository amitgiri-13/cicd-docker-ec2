---
name : "Build and run docker container in ec2"

on:
  push :
    branches:
      - main

jobs:
  deploy-my-code:
    name: "deploy my code in a container in ec2"
    runs-on: "ubuntu-latest"
    env:
      SERVER_IP = ${{ SERVER_IP }}
    
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Configure SSH"
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config
          cat ~/.ssh/config
          touch ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: "Make ssh connection"
        run: | 
          touch mykey.pem
          echo "$SSH_KEY64" | base64 -d > mykey.pem  && chmod 400 mykey.pem
          ssh-keygen -R $SERVER_IP
        env: 
          SSH_KEY64: ${{ secrets.SSH_KEY64 }}

      - name: "Pull code and run container"
        run: |
          ssh -t ubuntu@$SERVER_IP -i mykey.pem  << 'EOF'
            APP_DIR="member-manager"
            REPO_URL="git@github.com:amitgiri-13/cicd-docker-ec2.git"

            if [ -d $APP_DIR/.git ]; then 
              echo "Repo exists..."
              echo "Pulling latest changes..."
              cd ~/$APP_DIR
              git pull origin main 
            else
              echo "Repo doesn't exist..."
              echo "Clonning repo..."
              git clone $REPO_URL $APP_DIR
              cd $APP_DIR
            fi

            docker compose up -d
          EOF

          

            

