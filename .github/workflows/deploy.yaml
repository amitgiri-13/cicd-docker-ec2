name: "Build and run docker container in EC2"

on:
  push:
    tags:
      - "v*"
      

jobs:
  deploy-my-code:
    name: "Deploy my code in Docker container on EC2"
    runs-on: ubuntu-latest
    env:
      SERVER_IP: ${{ vars.SERVER_IP }}
      DOCKER_USER: ${{ vars.DOCKER_USER }}
      DOCKER_REPO: ${{ vars.DOCKER_REPO }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up TAG
        run: |
          echo "TAG=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Set up Docker Buildx 
        uses: docker/setup-buildx-action@v3

      - name: Login to Dockerhub
        run: |
          echo "$TAG"
          echo "${{ secrets.DOCKER_HUB_PASSWORD }}" | docker login -u $DOCKER_USER --password-stdin

      - name: Build Docker image
        run: |
          docker build -t "$DOCKER_USER/$DOCKER_REPO:$TAG" .

      - name: Push Docker image
        run: | 
          docker push "$DOCKER_USER/$DOCKER_REPO:$TAG"


